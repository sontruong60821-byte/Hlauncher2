workflows:
  hlauncher-android:
    name: HLauncher Android build
    max_build_duration: 120
    instance_type: linux_x2
    environment:
      java: 17
      android: stable
      groups: []
    scripts:
      - name: Initialize submodules
        script: git submodule update --init --recursive
      - name: Build HLauncher full release APK
        script: ./gradlew --no-daemon --stacktrace assembleFullRelease
    artifacts:
      - app_pojavlauncher/build/outputs/apk/**/*.apk
      - app_pojavlauncher/build/outputs/mapping/**/*.txt
